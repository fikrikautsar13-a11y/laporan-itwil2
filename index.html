<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System Login & Interactive Report Dashboard</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0b0f19;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* BACKGROUND ANIMASI LAPORAN GEGERAK */
    .report-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      opacity: 0.15;
      z-index: 1;
      pointer-events: none;
    }

    .chart-line {
      width: 100%;
      height: 80px;
      background: linear-gradient(90deg, rgba(0, 210, 255, 0) 0%, rgba(0, 210, 255, 0.4) 50%, rgba(0, 210, 255, 0) 100%);
      animation: pulseLine 4s infinite ease-in-out;
    }

    .bars-container {
      display: flex;
      align-items: flex-end;
      justify-content: space-around;
      height: 250px;
      padding: 0 50px;
    }

    .bar {
      width: 30px;
      background: linear-gradient(180deg, #00d2ff, #3a7bd5);
      border-radius: 4px 4px 0 0;
      animation: floatBar 3s infinite alternate ease-in-out;
    }

    /* Variasi tinggi & kecepatan animasi bar */
    .bar:nth-child(1) { height: 40%; animation-duration: 2.2s; }
    .bar:nth-child(2) { height: 75%; animation-duration: 3.1s; }
    .bar:nth-child(3) { height: 50%; animation-duration: 1.8s; }
    .bar:nth-child(4) { height: 90%; animation-duration: 2.7s; }
    .bar:nth-child(5) { height: 30%; animation-duration: 3.5s; }
    .bar:nth-child(6) { height: 65%; animation-duration: 2.0s; }
    .bar:nth-child(7) { height: 85%; animation-duration: 2.9s; }

    @keyframes floatBar {
      0% { transform: scaleY(0.3); opacity: 0.4; }
      100% { transform: scaleY(1); opacity: 1; }
    }

    @keyframes pulseLine {
      0%, 100% { opacity: 0.2; transform: translateY(0); }
      50% { opacity: 0.8; transform: translateY(-15px); }
    }

    /* KARTU LOGIN (GLASSMORPHISM) */
    .login-card {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 400px;
      padding: 40px 30px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(10px);
    }

    .login-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .login-header h2 {
      font-size: 24px;
      font-weight: 600;
      letter-spacing: 1px;
      color: #00d2ff;
    }

    .login-header p {
      font-size: 13px;
      color: #a0aec0;
      margin-top: 5px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      color: #cbd5e0;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-group input {
      width: 100%;
      padding: 12px 16px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: all 0.3s ease;
    }

    .form-group input:focus {
      border-color: #00d2ff;
      box-shadow: 0 0 8px rgba(0, 210, 255, 0.4);
    }

    .btn-login {
      width: 100%;
      padding: 12px;
      background: linear-gradient(90deg, #00d2ff, #3a7bd5);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      margin-top: 10px;
    }

    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 210, 255, 0.4);
    }

    .btn-login:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <!-- Background Animasi Laporan/Grafik -->
  <div class="report-bg">
    <div class="chart-line"></div>
    <div class="bars-container">
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
    </div>
    <div class="chart-line"></div>
  </div>

  <!-- Form Login -->
  <div class="login-card">
    <div class="login-header">
      <h2>REPORT DASHBOARD</h2>
      <p>Silakan masuk untuk melihat laporan sistem</p>
    </div>
    <form action="#" method="POST">
      <div class="form-group">
        <label for="username">Username / Email</label>
        <input type="text" id="username" placeholder="Masukkan username Anda" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn-login">Masuk ke Sistem</button>
    </form>
  </div>

</body>
</html>
