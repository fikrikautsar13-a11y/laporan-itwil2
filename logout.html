<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logout - Inspektorat Wilayah II</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-sm text-center">
        <!-- Spinner Loading Animation -->
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-slate-800 text-blue-400 border border-slate-700 shadow-xl mb-6 relative">
            <i class="fa-solid fa-right-from-bracket text-2xl"></i>
            <div class="absolute inset-0 border-2 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
        </div>

        <h2 class="text-xl font-bold text-white mb-1">Mengakhiri Sesi...</h2>
        <p class="text-slate-400 text-xs mb-6">Sesi login Anda berhasil dihapus dari sistem. Mengalihkan Anda kembali ke halaman masuk...</p>

        <a href="login.html" class="inline-flex items-center gap-2 text-xs font-semibold text-blue-400 hover:text-blue-300 transition-colors">
            <span>Klik di sini jika tidak teralihkan otomatis</span>
            <i class="fa-solid fa-arrow-right"></i>
        </a>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // Hapus sesi autentikasi dari localStorage maupun sessionStorage
            localStorage.removeItem('itwil2_session');
            sessionStorage.removeItem('itwil2_session');

            // Redirect otomatis ke login.html setelah 1.5 detik
            setTimeout(() => {
                window.location.href = 'login.html';
            }, 1500);
        });
    </script>
</body>
</html>
